<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Payment</title>
</head>
<body>

<h1>Edit Payment</h1>

<form method="POST">

    <label>Payment Amount</label><br>
    <input
        type="number"
        name="payment_amount"
        step="0.01"
        min="0.01"
        value="{{ payment['payment_amount'] }}"
        required
    >

    <br><br>

    <label>Payment Method</label><br>

    <select name="payment_method" required>
        <option value="Cash"
            {% if payment['payment_method'] == 'Cash' %}selected{% endif %}>
            Cash
        </option>

        <option value="GCash"
            {% if payment['payment_method'] == 'GCash' %}selected{% endif %}>
            GCash
        </option>

        <option value="Bank Transfer"
            {% if payment['payment_method'] == 'Bank Transfer' %}selected{% endif %}>
            Bank Transfer
        </option>
    </select>

    <br><br>

    <button type="submit">Save Changes</button>

    <a href="/payments-page">Cancel</a>

</form>

</body>
</html>
