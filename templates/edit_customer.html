<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Customer</title>
</head>

<body>

<h1>Edit Customer</h1>

<form method="POST">

    <label>Customer Name</label><br>

    <input
        type="text"
        name="name"
        value="{{ customer['name'] }}"
        required
    >

    <br><br>

    <label>Contact Number</label><br>

    <input
        type="text"
        name="contact_number"
        value="{{ customer['contact_number'] }}"
        required
    >

    <br><br>

    <button type="submit">
        Save Changes
    </button>

    <a href="/customers-page">
        Cancel
    </a>

</form>

</body>
</html>
