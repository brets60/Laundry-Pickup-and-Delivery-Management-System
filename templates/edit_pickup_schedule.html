<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Pickup Schedule</title>
</head>
<body>

<h1>Edit Pickup Schedule</h1>

<form method="POST">

    <label>Customer</label><br>
    <input
        type="text"
        name="customer"
        value="{{ pickup['customer'] }}"
        required
    >

    <br><br>

    <label>Pickup Date</label><br>
    <input
        type="date"
        name="pickup_date"
        value="{{ pickup['pickup_date'] }}"
        required
    >

    <br><br>

    <button type="submit">Save Changes</button>

    <a href="/pickup-schedules-page">Cancel</a>

</form>

</body>
</html>
