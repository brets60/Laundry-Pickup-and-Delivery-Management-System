<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Laundry Order</title>
</head>
<body>

<h1>Edit Laundry Order</h1>

<form method="POST">

    <label>Customer</label><br>
    <input
        type="text"
        name="customer"
        value="{{ order['customer'] }}"
        required
    >

    <br><br>

    <label>Laundry Weight (kg)</label><br>
    <input
        type="number"
        name="laundry_weight"
        step="0.01"
        min="0.01"
        value="{{ order['laundry_weight'] }}"
        required
    >

    <br><br>

    <button type="submit">Save Changes</button>

    <a href="/laundry-orders-page">Cancel</a>

</form>

</body>
</html>
