<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Delivery Record</title>
</head>
<body>

<h1>Edit Delivery Record</h1>

<form method="POST">

    <label>Customer</label><br>
    <input
        type="text"
        name="customer"
        value="{{ delivery['customer'] }}"
        required
    >

    <br><br>

    <label>Delivery Date</label><br>
    <input
        type="date"
        name="delivery_date"
        value="{{ delivery['delivery_date'] }}"
        required
    >

    <br><br>

    <button type="submit">Save Changes</button>

    <a href="/delivery-records-page">Cancel</a>

</form>

</body>
</html>
