services:
  - type: web
    name: laundrycare-management
    env: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /track
    envVars:
      - key: FLASK_ENV
        value: production
      - key: APP_DEBUG
        value: "False"
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE
        value: laundry.db
      - key: PYTHON_VERSION
        value: 3.11.9
